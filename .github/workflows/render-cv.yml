# Re-renders the PDF CV with RenderCV whenever cv/cv.yml (or its RenderCV
# config) changes on main, and commits the result to cv/rendercv/output/.
name: Render CV
on:
  push:
    branches: [main]
    paths:
      - "cv/cv.yml"
      - "cv/rendercv/*.yaml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rendercv:
    name: RenderCV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install RenderCV
        run: pip install -r cv/requirements.txt
      - name: Render
        run: |
          rendercv render cv/cv.yml --settings cv/rendercv/settings.yaml
          rm -f cv/rendercv/output/*.typ
      - name: Upload output
        uses: actions/upload-artifact@v4
        with:
          name: RenderCV Output
          path: cv/rendercv/output
      - name: Commit the rendered CV
        run: |
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor }}@users.noreply.github.com"
          git add cv/rendercv/output
          git diff --cached --quiet && echo "CV unchanged" && exit 0
          git commit -m "chore: render the latest CV"
          git push
