# for details on settings, see https://docs.rendercv.com/user_guide/yaml_input_structure/settings/
settings:
  render_command:
    # Paths are relative to cv/cv.yml
    design: rendercv/design.yaml
    locale: rendercv/locale.yaml
    typst_path: rendercv/output/NAME_IN_SNAKE_CASE_CV.typ
    pdf_path: rendercv/output/NAME_IN_SNAKE_CASE_CV.pdf
    markdown_path: rendercv/output/NAME_IN_SNAKE_CASE_CV.md
    html_path: rendercv/output/NAME_IN_SNAKE_CASE_CV.html
    png_path: rendercv/output/NAME_IN_SNAKE_CASE_CV.png
    dont_generate_markdown: true
    dont_generate_html: true
    dont_generate_typst: false # typst generation is required for pdf output
    dont_generate_pdf: false
    dont_generate_png: true
  bold_keywords: []
